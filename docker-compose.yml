# Infraestrutura local de desenvolvimento.
#   docker compose up -d
# PostgreSQL: localhost:5432 (usuário/senha/banco: telemetry)
# RabbitMQ:   localhost:5672 — painel em http://localhost:15672 (guest/guest), usado a partir do Mês 2.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
      POSTGRES_DB: telemetry
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres-data:
